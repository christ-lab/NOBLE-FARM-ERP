services:
  - type: web
    name: noble-farm-erp-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE
        scope: run
        sync: false
      - key: JWT_SECRET
        scope: run
        sync: false
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SERVER_FILE
        value: https://erp.noblefarms.uk
      - key: PORT
        value: '10000'
      - key: OPENSSL_CONF
        value: /dev/null
      - key: SKIP_SETUP
        value: 'true'
