version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - DATABASE=${DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_SERVER_FILE=http://localhost:10000
      - PORT=10000
      - OPENSSL_CONF=/dev/null
      - NODE_OPTIONS=--openssl-legacy-provider
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://backend:10000/api
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: noble-farms-network
